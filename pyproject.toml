[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wids-2026"
version = "0.1.0"
description = "WiDS 2026 wildfire danger prediction project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "shap>=0.45.0",
    "joblib>=1.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
